<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORNEX | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0f0f0f; color: #fff; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .card h2 { margin-bottom: 15px; font-size: 1.2rem; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: 800; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; font-size: 0.9rem; border-radius: 4px; }
        button { width: 100%; padding: 14px; background: #fff; color: #000; font-weight: 900; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; font-size: 0.9rem; }
        button:hover { background: #ccc; }
        .product-list { display: grid; gap: 10px; }
        .product-item { background: #000; border: 1px solid #333; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .product-item img { width: 50px; height: 65px; object-fit: cover; margin-right: 15px; }
        .p-details { flex-grow: 1; display: flex; align-items: center; }
        .btn-delete { background: #ff3333; color: #fff; width: auto; padding: 8px 14px; font-size: 0.75rem; margin: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <h1>VORNEX ADMIN PANEL</h1>
        
        <div class="card">
            <h2>➕ Add New Product</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" placeholder="e.g. VORNEX HEAVYWEIGHT TEE" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="pCategory">
                        <option value="Oversized Tees">Oversized Tees</option>
                        <option value="T-shirts">T-shirts</option>
                        <option value="Shirts">Shirts</option>
                        <option value="Hoodies">Hoodies</option>
                        <option value="Sweatshirts">Sweatshirts</option>
                        <option value="Jeans">Jeans</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="pPrice" placeholder="799" required>
                </div>
                <div class="form-group">
                    <label>Tag / Badge</label>
                    <input type="text" id="pTag" placeholder="BESTSELLER / NEW DROP / HOT" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="pImage" placeholder="https://..." required>
                </div>
                <button type="submit">ADD PRODUCT TO WEBSITE</button>
            </form>
        </div>

        <div class="card">
            <h2>📦 Live Products List</h2>
            <div id="adminProductList" class="product-list">Loading products...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDItBcWY7ww6jj73h1HEtaTm",
            authDomain: "vornex-b7a62.firebaseapp.com",
            databaseURL: "https://vornex-b7a62-default-rtdb.firebaseio.com",
            projectId: "vornex-b7a62",
            storageBucket: "vornex-b7a62.firebasestorage.app",
            messagingSenderId: "60746200967",
            appId: "1:60746200967:web:29bf4cb533b1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('products');

        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newProd = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                price: parseInt(document.getElementById('pPrice').value),
                tag: document.getElementById('pTag').value,
                image: document.getElementById('pImage').value
            };
            db.push(newProd, (err) => {
                if(!err) {
                    alert('Product Added Successfully!');
                    document.getElementById('addProductForm').reset();
                } else {
                    alert('Error adding product: ' + err.message);
                }
            });
        });

        db.on('value', (snapshot) => {
            const listEl = document.getElementById('adminProductList');
            listEl.innerHTML = "";
            const data = snapshot.val();
            if(!data) {
                listEl.innerHTML = "<p>No products found. Add one above!</p>";
                return;
            }
            Object.keys(data).forEach(key => {
                const p = data[key];
                listEl.innerHTML += `
                    <div class="product-item">
                        <div class="p-details">
                            <img src="${p.image}" alt="">
                            <div>
                                <strong>${p.name}</strong><br>
                                <small>₹${p.price} | ${p.category} | ${p.tag}</small>
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct('${key}')">DELETE</button>
                    </div>
                `;
            });
        });

        function deleteProduct(key) {
            if(confirm("Are you sure you want to delete this product?")) {
                db.child(key).remove();
            }
        }
    </script>
</body>
</html>
