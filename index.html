<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabir Mobile — Premium Second Hand Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-badge">🔴</span>
                <span class="logo-text">KABIR MOBILE</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search iPhone, Samsung, Vivo..." onkeyup="searchMobiles()">
            </div>
            <div class="header-actions">
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 <span class="cart-label">Cart</span>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Announcement -->
    <section class="top-banner">
        <p>🔥 Best Quality Certified Second Hand Smartphones | Cash on Delivery Available 🚚</p>
    </section>

    <!-- Category Filters -->
    <nav class="categories-bar">
        <button class="cat-chip active" onclick="filterBrand('All')">All</button>
        <button class="cat-chip" onclick="filterBrand('iPhone')"> iPhone</button>
        <button class="cat-chip" onclick="filterBrand('Samsung')">Samsung</button>
        <button class="cat-chip" onclick="filterBrand('Vivo')">Vivo</button>
        <button class="cat-chip" onclick="filterBrand('Oppo')">Oppo</button>
        <button class="cat-chip" onclick="filterBrand('OnePlus')">OnePlus</button>
        <button class="cat-chip" onclick="filterBrand('Motorola')">Motorola</button>
        <button class="cat-chip" onclick="filterBrand('Redmi')">Redmi</button>
        <button class="cat-chip" onclick="filterBrand('Realme')">Realme</button>
        <button class="cat-chip" onclick="filterBrand('Other')">Other</button>
    </nav>

    <!-- Products Main Container -->
    <main class="container">
        <div class="section-title">
            <h2>Available Mobiles</h2>
            <span class="live-indicator">🟢 Live Stock</span>
        </div>

        <div class="products-grid" id="productsContainer">
            <!-- Products will be loaded dynamically or from demo data -->
        </div>
    </main>

    <!-- Cart Modal Overlay -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛒 Shopping Cart</h3>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            <div id="cartItems" class="cart-items-list">
                <p class="empty-msg">Your cart is empty.</p>
            </div>
            <div class="cart-footer">
                <div class="total-price-box">
                    <span>Total:</span>
                    <strong id="cartTotal">₹0</strong>
                </div>
                <div class="checkout-form">
                    <input type="text" id="custName" placeholder="Your Full Name">
                    <input type="tel" id="custPhone" placeholder="WhatsApp / Phone Number">
                    <textarea id="custAddress" placeholder="Delivery Address"></textarea>
                    <button class="btn-whatsapp-checkout" onclick="checkoutWhatsApp()">
                        💬 Order via WhatsApp (Cash On Delivery)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/919876543210" class="float-wa" target="_blank" title="Contact Us on WhatsApp">
        💬
    </a>

    <!-- Footer -->
    <footer>
        <p>© 2026 Kabir Mobile — Premium Second Hand Store. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
