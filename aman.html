<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORNEX Admin - Coupon & Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0d; color: #f4f4f4; padding: 20px; }
        .admin-container { max-width: 500px; margin: 20px auto; background: #161616; padding: 25px; border-radius: 12px; border: 1px solid #282828; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .admin-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #282828; padding-bottom: 15px; margin-bottom: 20px; }
        .admin-header h2 { color: #10b981; font-size: 1.3rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #10b981; }
        .btn-submit { width: 100%; padding: 12px; background: #10b981; color: #000; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background: #059669; }
        
        .coupon-list-section { margin-top: 30px; border-top: 1px solid #282828; padding-top: 20px; }
        .coupon-list-section h3 { font-size: 1rem; color: #ddd; margin-bottom: 15px; }
        .coupon-card { display: flex; justify-content: space-between; align-items: center; background: #202020; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #10b981; }
        .coupon-details strong { font-size: 1rem; color: #fff; letter-spacing: 1px; }
        .coupon-details span { display: block; font-size: 0.78rem; color: #10b981; margin-top: 2px; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .btn-delete:hover { background: #dc2626; }
        .empty-text { color: #666; font-size: 0.85rem; text-align: center; padding: 10px 0; }
    </style>
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-ticket"></i> VORNEX Coupon Admin</h2>
        </div>

        <form id="couponForm" onsubmit="createCoupon(event)">
            <div class="form-group">
                <label>COUPON CODE</label>
                <input type="text" id="cpCode" placeholder="उदा. VORNEX10, FLAT200" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label>DISCOUNT TYPE</label>
                <select id="cpType">
                    <option value="percent">Percent Discount (% OFF)</option>
                    <option value="flat">Flat Discount (₹ OFF)</option>
                </select>
            </div>

            <div class="form-group">
                <label>DISCOUNT VALUE</label>
                <input type="number" id="cpValue" placeholder="10 (Percent ke liye) ya 200 (Flat ke liye)" required min="1">
            </div>

            <button type="submit" class="btn-submit">GENERATE & SAVE COUPON</button>
        </form>

        <div class="coupon-list-section">
            <h3>ACTIVE COUPONS (LIVE FROM FIREBASE)</h3>
            <div id="activeCoupons">
                <p class="empty-text">Loading coupons...</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDItBcWY7ww6jj73h1HEtaTm7YllIBLQ1c",
            authDomain: "vornex-b7a62.firebaseapp.com",
            databaseURL: "https://vornex-b7a62-default-rtdb.firebaseio.com",
            projectId: "vornex-b7a62",
            storageBucket: "vornex-b7a62.firebasestorage.app",
            messagingSenderId: "60746200967",
            appId: "1:60746200967:web:29bf4cb533b14db3080522"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const couponsRef = db.ref('coupons');

        // Create Coupon Function
        function createCoupon(e) {
            e.preventDefault();
            const code = document.getElementById('cpCode').value.trim().toUpperCase();
            const type = document.getElementById('cpType').value;
            const value = parseFloat(document.getElementById('cpValue').value);

            if (!code || isNaN(value)) {
                alert("Kripya sahi details bharein!");
                return;
            }

            const label = type === 'percent' ? `${value}% OFF` : `₹${value} OFF`;

            couponsRef.child(code).set({
                code: code,
                type: type,
                value: value,
                label: label,
                createdAt: new Date().toISOString()
            }).then(() => {
                alert(`✅ Coupon '${code}' Successfully Generate Ho Gaya!`);
                document.getElementById('couponForm').reset();
            }).catch(err => {
                alert("Error: " + err.message);
            });
        }

        // Fetch Live Coupons from Firebase
        couponsRef.on('value', snapshot => {
            const data = snapshot.val() || {};
            const container = document.getElementById('activeCoupons');
            const keys = Object.keys(data);

            if (keys.length === 0) {
                container.innerHTML = `<p class="empty-text">Koi bhi active coupon nahi hai.</p>`;
                return;
            }

            let html = "";
            keys.forEach(code => {
                const item = data[code];
                const displayLabel = item.label || (item.type === 'percent' ? `${item.value}% OFF` : `₹${item.value} OFF`);
                
                html += `
                    <div class="coupon-card">
                        <div class="coupon-details">
                            <strong>${code}</strong>
                            <span>${displayLabel}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteCoupon('${code}')">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        // Delete Coupon
        function deleteCoupon(code) {
            if (confirm(`Kya aap '${code}' coupon ko delete karna chahte hain?`)) {
                couponsRef.child(code).remove();
            }
        }
    </script>
</body>
</html>
